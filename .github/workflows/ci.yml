name: Verificar PixelZen Worlds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias opcionales (Pillow y GJS)
        run: |
          python -m pip install --upgrade pip pillow
          sudo apt-get update && sudo apt-get install -y gjs

      - name: Ejecutar suite de verificación
        run: python3 tests/verificar.py
