name: Verificar PixelZen Worlds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias opcionales (Pillow y GJS)
        run: |
          python -m pip install --upgrade pip pillow
          sudo apt-get update && sudo apt-get install -y gjs

      - name: Ejecutar suite de verificación
        run: python3 tests/verificar.py

      - name: Validar sintaxis PowerShell
        shell: pwsh
        run: |
          foreach ($ps in @('windows/PixelZenMenu.ps1','windows/PixelZenMotor.ps1','windows/PixelZenHud.ps1','windows/PixelZenCiclo.ps1','windows/installer/Desinstalar.ps1','scripts/empaquetar_windows.ps1','scripts/instalar.ps1')) {
            $errs = $null; $toks = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $ps), [ref]$toks, [ref]$errs)
            if ($errs.Count -gt 0) { throw "Errores en ${ps}: $($errs | Out-String)" }
          }
