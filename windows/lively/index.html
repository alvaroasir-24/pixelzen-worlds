<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelZen Worlds - Windows / Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0c24;
      font-family: "Courier New", monospace;
    }
    #lienzo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    #hud {
      position: fixed;
      top: 24px;
      right: 24px;
      width: min(320px, 24vw);
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      color: #f3ead6;
    }
    .card {
      background: rgba(11, 16, 32, 0.82);
      border: 1px solid #7d6540;
      padding: 12px;
      box-shadow: inset 3px 3px 0 #d6a34a;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #a8b8cf;
      border-bottom: 1px dashed #2f4266;
      padding-bottom: 6px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .card-head span:first-child { color: #54ded4; }
    .clock {
      font-size: 38px;
      font-weight: bold;
      line-height: 1;
      letter-spacing: 1px;
    }
    .clock small { font-size: 16px; color: #54ded4; margin-left: 6px; }
    .sub { font-size: 12px; color: #e6c06e; margin-top: 6px; }
    .date { font-size: 12px; color: #a8b8cf; margin-top: 4px; }
    .quote { font-size: 12px; color: #a8b8cf; line-height: 1.4; margin-top: 4px; }
  </style>
</head>
<body>
  <canvas id="lienzo" width="640" height="400"></canvas>
  <aside id="hud">
    <div class="card">
      <div class="card-head"><span>✦ TIEMPO</span><span id="hud-modo">CICLO 90M</span></div>
      <div class="clock"><span id="hud-hm">--:--</span><small id="hud-s">--</small></div>
      <div class="date" id="hud-fecha"></div>
      <div class="sub" id="hud-tema"></div>
    </div>
    <div class="card">
      <div class="card-head"><span>✧ GRIMORIO</span><span id="hud-au"></span></div>
      <div class="sub" id="hud-qsub"></div>
      <div class="quote" id="hud-qtxt"></div>
    </div>
  </aside>
  <script src="pixelzen-canvas.js"></script>
  <script src="escena-web.js"></script>
</body>
</html>
